          cat > $P/Sfx.kt << 'EOF'
          package com.kutu.app

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.HapticFeedbackConstants
          import android.view.View
          import kotlin.math.PI
          import kotlin.math.exp
          import kotlin.math.sin

          object Sfx {
              @Volatile var enabled = true
              private const val SR = 22050
              private val main = Handler(Looper.getMainLooper())
              private var lastTick = 0L

              private fun noise(): Double = Math.random() * 2.0 - 1.0

              private fun gen(ms: Int, f: (Double, Double) -> Double): ShortArray {
                  val n = SR * ms / 1000
                  return ShortArray(n) { i ->
                      val t = i.toDouble() / SR
                      val v = f(t, i.toDouble() / n).coerceIn(-1.0, 1.0)
                      (v * 30000.0).toInt().toShort()
                  }
              }

              private val tickS: ShortArray by lazy {
                  gen(60) { t, _ -> sin(2 * PI * 1800 * t) * exp(-t * 90) * 0.7 + noise() * exp(-t * 400) * 0.3 }
              }
              private val lidS: ShortArray by lazy {
                  gen(260) { t, p -> (sin(2 * PI * (130 - 70 * p) * t) * exp(-t * 24) + 0.5 * noise() * exp(-t * 110)) * 0.9 }
              }
              private val knockS: ShortArray by lazy {
                  gen(180) { t, _ ->
                      (sin(2 * PI * 190 * t) * exp(-t * 34) + 0.6 * sin(2 * PI * 410 * t) * exp(-t * 55) + 0.35 * noise() * exp(-t * 220)) * 0.85
                  }
              }
              private val popS: ShortArray by lazy {
                  gen(240) { t, p -> sin(2 * PI * (500 + 1500 * p) * t) * exp(-t * 12) * 0.6 }
              }
              private val openS: ShortArray by lazy {
                  gen(380) { t, p -> sin(2 * PI * (180 + 380 * p) * t) * 0.3 * (1 - p) + noise() * 0.12 * exp(-t * 14) }
              }

              private fun play(s: ShortArray) {
                  if (!enabled) return
                  try {
                      val t = AudioTrack.Builder()
                          .setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build()
                          )
                          .setAudioFormat(
                              AudioFormat.Builder()
                                  .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                  .setSampleRate(SR)
                                  .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                  .build()
                          )
                          .setBufferSizeInBytes(s.size * 2)
                          .setTransferMode(AudioTrack.MODE_STATIC)
                          .build()
                      t.write(s, 0, s.size)
                      t.play()
                      main.postDelayed({
                          try {
                              t.release()
                          } catch (e: Exception) {
                          }
                      }, (s.size * 1000L / SR) + 300L)
                  } catch (e: Exception) {
                  }
              }

              fun buzz(c: Context, ms: Long) {
                  if (!enabled) return
                  try {
                      val vb = c.getSystemService(Vibrator::class.java)
                      vb.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE))
                  } catch (e: Exception) {
                  }
              }

              fun tick(v: View?) {
                  if (!enabled) return
                  val n = System.currentTimeMillis()
                  if (n - lastTick < 90L) return
                  lastTick = n
                  play(tickS)
                  v?.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
              }

              fun lid(v: View?) {
                  if (!enabled) return
                  play(lidS)
                  v?.performHapticFeedback(if (Build.VERSION.SDK_INT >= 30) HapticFeedbackConstants.CONFIRM else HapticFeedbackConstants.LONG_PRESS)
              }

              fun knock(c: Context) {
                  play(knockS)
                  buzz(c, 35L)
              }

              fun pop(c: Context) {
                  play(popS)
                  buzz(c, 25L)
              }

              fun open(c: Context) {
                  play(openS)
              }
          }
          EOF

