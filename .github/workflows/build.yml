          cat > $P/Net.kt << 'EOF'
          package com.kutu.app

          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import org.json.JSONObject
          import android.webkit.MimeTypeMap
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLDecoder

          class Info(
              val name: String,
              val type: String,
              val total: Long,
              val ranges: Boolean,
              val mime: String?,
              val isPage: Boolean = false
          )

          class Quick(val title: String, val thumb: String?, val author: String)

          object Net {
              const val UA = "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"

              fun open(url: String, from: Long, to: Long): HttpURLConnection {
                  var u = url
                  for (n in 0 until 8) {
                      val c = URL(u).openConnection() as HttpURLConnection
                      c.connectTimeout = 15000
                      c.readTimeout = 20000
                      c.instanceFollowRedirects = false
                      c.setRequestProperty("User-Agent", UA)
                      c.setRequestProperty("Accept", "*/*")
                      c.setRequestProperty("Accept-Encoding", "identity")
                      if (from >= 0) c.setRequestProperty("Range", "bytes=" + from + "-" + (if (to >= 0) to.toString() else ""))
                      val code = c.responseCode
                      if (code in 301..303 || code == 307 || code == 308) {
                          val loc = c.getHeaderField("Location") ?: throw IOException("yonlendirme")
                          u = URL(URL(u), loc).toString()
                          c.disconnect()
                          continue
                      }
                      return c
                  }
                  throw IOException("cok fazla yonlendirme")
              }

              fun probe(url: String): Info {
                  val c = open(url, 0, 0)
                  try {
                      val code = c.responseCode
                      val ct = c.contentType
                      var total = -1L
                      var ranges = false
                      if (code == 206) {
                          ranges = true
                          total = c.getHeaderField("Content-Range")?.substringAfter('/')?.trim()?.toLongOrNull() ?: -1L
                      } else if (code == 200) {
                          total = c.contentLengthLong
                      } else {
                          throw IOException("HTTP " + code)
                      }
                      val ctm = ct?.substringBefore(';')?.trim()?.lowercase() ?: ""
                      if (ctm.contains("text/html") || ctm.contains("xhtml")) {
                          return Info(Store.nameFromUrl(c.url.toString()), "sayfa", total, false, ct, true)
                      }
                      val cd = c.getHeaderField("Content-Disposition") ?: ""
                      var nm: String? = Regex("filename\\*?=(?:UTF-8'')?\"?([^\";]+)\"?", RegexOption.IGNORE_CASE)
                          .find(cd)?.groupValues?.get(1)
                      if (nm != null) {
                          try {
                              nm = URLDecoder.decode(nm, "UTF-8")
                          } catch (e: Exception) {
                          }
                      }
                      var n2: String = if (nm.isNullOrBlank()) Store.nameFromUrl(c.url.toString()) else Store.clean(nm)
                      val isMedia = ctm.startsWith("video/") || ctm.startsWith("audio/") || ctm.startsWith("image/")
                      val cur = n2.substringAfterLast('.', "").lowercase()
                      if (isMedia && cur !in Store.mediaExts) {
                          val ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(ctm)
                          if (ext != null) {
                              val base = if (cur in Store.webExts) n2.substringBeforeLast('.') else n2
                              n2 = base + "." + ext
                          }
                      } else if (!n2.contains('.')) {
                          val ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(ctm)
                          if (ext != null) n2 = n2 + "." + ext
                      }
                      return Info(n2, Store.typeOf(n2, ct), total, ranges, ct)
                  } finally {
                      c.disconnect()
                  }
              }

              // Web sayfasının içindeki doğrudan indirilebilir medya linklerini bulur
              fun scan(url: String): List<String> {
                  val c = open(url, -1, -1)
                  val base = c.url
                  val sb = StringBuilder()
                  try {
                      val ins = c.inputStream
                      val buf = ByteArray(16384)
                      var total = 0
                      while (total < 3000000) {
                          val n = ins.read(buf)
                          if (n < 0) break
                          sb.append(String(buf, 0, n, Charsets.UTF_8))
                          total += n
                      }
                  } finally {
                      c.disconnect()
                  }
                  val html = sb.toString().replace("\\/", "/").replace("\\u0026", "&").replace("&amp;", "&")
                  val found = LinkedHashSet<String>()
                  fun add(raw: String) {
                      try {
                          val u = URL(base, raw.trim()).toString()
                          if (u.startsWith("http")) found.add(u)
                      } catch (e: Exception) {
                      }
                  }
                  val ic = RegexOption.IGNORE_CASE
                  val metaKeys = "og:video(?::secure_url|:url)?|twitter:player:stream|og:audio"
                  for (m in Regex("<meta[^>]+(?:property|name)=[\"'](?:" + metaKeys + ")[\"'][^>]*content=[\"']([^\"']+)[\"']", ic).findAll(html)) add(m.groupValues[1])
                  for (m in Regex("<meta[^>]+content=[\"']([^\"']+)[\"'][^>]+(?:property|name)=[\"'](?:" + metaKeys + ")[\"']", ic).findAll(html)) add(m.groupValues[1])
                  for (m in Regex("<(?:video|source|audio)[^>]+src=[\"']([^\"']+)[\"']", ic).findAll(html)) add(m.groupValues[1])
                  for (m in Regex("\"contentUrl\"\\s*:\\s*\"([^\"]+)\"").findAll(html)) add(m.groupValues[1])
                  for (m in Regex("https?://[^\\s\"'<>\\\\)]+?\\.(?:mp4|webm|mkv|mov|m4v|mp3|m4a|flac|ogg|wav)(?:\\?[^\\s\"'<>\\\\)]*)?", ic).findAll(html)) add(m.value)
                  fun up(u: String): String =
                      if (u.contains("pinimg.com")) u.replace(Regex("/[0-9]+x[0-9]*/"), "/originals/") else u
                  for (m in Regex("<meta[^>]+(?:property|name)=[\"'](?:og:image|twitter:image)[\"'][^>]*content=[\"']([^\"']+)[\"']", ic).findAll(html)) add(up(m.groupValues[1]))
                  for (m in Regex("https?://i\\.pinimg\\.com/[^\\s\"'<>\\\\)]+?\\.(?:jpg|jpeg|png|webp|gif)", ic).findAll(html)) add(up(m.value))
                  for (m in Regex("https?://[^\\s\"'<>\\\\)]+?\\.m3u8[^\\s\"'<>\\\\)]*", ic).findAll(html)) add(m.value)
                  fun rank(u: String): Int {
                      val l = u.lowercase()
                      return if (l.contains(".m3u8")) 1 else if (Regex("\\.(jpg|jpeg|png|webp|gif)(\\?|$)").containsMatchIn(l)) 2 else 0
                  }
                  return found.sortedBy { rank(it) }.take(25)
              }

              private fun fast(u: String): HttpURLConnection {
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.connectTimeout = 6000
                  c.readTimeout = 6000
                  c.instanceFollowRedirects = true
                  c.setRequestProperty("User-Agent", UA)
                  c.setRequestProperty("Accept-Language", "en")
                  return c
              }

              private fun readText(c: HttpURLConnection, max: Int): String {
                  val sb = StringBuilder()
                  val ins = c.inputStream
                  val buf = ByteArray(16384)
                  var total = 0
                  while (total < max) {
                      val n = ins.read(buf)
                      if (n < 0) break
                      sb.append(String(buf, 0, n, Charsets.UTF_8))
                      total += n
                  }
                  return sb.toString()
              }

              private fun meta(html: String, key: String): String? {
                  val ic = RegexOption.IGNORE_CASE
                  val a = Regex("<meta[^>]+(?:property|name)=[\"']" + key + "[\"'][^>]*content=[\"']([^\"']*)[\"']", ic).find(html)?.groupValues?.get(1)
                  val b = Regex("<meta[^>]+content=[\"']([^\"']*)[\"'][^>]+(?:property|name)=[\"']" + key + "[\"']", ic).find(html)?.groupValues?.get(1)
                  val v = a ?: b ?: return null
                  return v.replace("&amp;", "&").replace("&quot;", "\"").replace("&#39;", "'").replace("&#x27;", "'")
              }

              // Anında önizleme: başlık + kapak resmi (YouTube için oEmbed, diğerleri için sayfa etiketleri)
              fun quick(url: String): Quick? {
                  try {
                      if (url.contains("youtube.com") || url.contains("youtu.be")) {
                          val c = fast("https://www.youtube.com/oembed?format=json&url=" + Uri.encode(url))
                          try {
                              val j = JSONObject(readText(c, 200000))
                              val th = j.optString("thumbnail_url", "")
                              return Quick(j.optString("title", "Video"), if (th.isEmpty()) null else th, j.optString("author_name", ""))
                          } finally {
                              c.disconnect()
                          }
                      }
                      val c = fast(url)
                      try {
                          val html = readText(c, 400000)
                          val t = meta(html, "og:title") ?: meta(html, "twitter:title") ?: return null
                          val img = meta(html, "og:image") ?: meta(html, "twitter:image")
                          return Quick(t, img, meta(html, "og:site_name") ?: "")
                      } finally {
                          c.disconnect()
                      }
                  } catch (e: Exception) {
                      return null
                  }
              }

              fun resolve(url: String): String {
                  val c = open(url, -1, -1)
                  try {
                      return c.url.toString()
                  } finally {
                      c.disconnect()
                  }
              }

              fun bitmap(url: String): Bitmap? {
                  return try {
                      val c = open(url, -1, -1)
                      try {
                          BitmapFactory.decodeStream(c.inputStream)
                      } finally {
                          c.disconnect()
                      }
                  } catch (e: Exception) {
                      null
                  }
              }
          }
