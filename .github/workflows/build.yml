          cat > $P/YtJob.kt << 'EOF'
          package com.kutu.app

          import android.content.Context
          import java.io.File

          interface Job {
              fun run()
              fun pause()
          }

          class YtJob(private val ctx: Context, private val item: Item, private val onTick: () -> Unit) : Job {
              @Volatile private var stop = false
              @Volatile private var finished = false
              private var lastSave = 0L
              private var lastUi = 0L

              override fun pause() {
                  stop = true
                  Ytdlp.cancel(item.id)
              }

              private fun dirBytes(dir: File): Long =
                  dir.listFiles()?.filter { it.isFile && !it.name.endsWith(".aria2") }?.sumOf { it.length() } ?: 0L

              // yt-dlp/aria2c ilerlemeyi her zaman vermediği için klasördeki dosya boyutundan hız ve yüzde hesaplanır
              private fun startPoller(dir: File) {
                  val t = Thread {
                      var lastB = dirBytes(dir)
                      var lastT = System.currentTimeMillis()
                      while (!finished && !stop) {
                          try {
                              Thread.sleep(700)
                          } catch (e: InterruptedException) {
                              break
                          }
                          val b = dirBytes(dir)
                          val now = System.currentTimeMillis()
                          val dt = maxOf(1L, now - lastT)
                          val inst = maxOf(0L, (b - lastB) * 1000L / dt)
                          item.speed = if (item.speed == 0L) inst else (item.speed * 6L + inst * 4L) / 10L
                          lastB = b
                          lastT = now
                          item.got = b
                          val tot = item.total
                          if (tot > 0L) {
                              val f = minOf(0.97f, b.toFloat() / tot)
                              if (f > item.frac) item.frac = f
                              if (item.speed > 0L) item.etaSec = maxOf(0L, (tot - b) / item.speed)
                          } else {
                              val f = minOf(0.9f, 1f - 1f / (1f + b / 52428800f))
                              if (f > item.frac) item.frac = f
                          }
                          if (now - lastSave > 3000L) {
                              lastSave = now
                              Store.save(ctx)
                          }
                          onTick()
                      }
                  }
                  t.start()
              }

              private fun progress(p: Float, eta: Long) {
                  if (item.total <= 0L) {
                      if (p >= 0f) {
                          val f = p / 100f
                          if (f > item.frac) item.frac = f
                      }
                      if (eta > 0L) item.etaSec = eta
                  }
                  val now = System.currentTimeMillis()
                  if (now - lastUi > 500L) {
                      lastUi = now
                      onTick()
                  }
              }

              override fun run() {
                  try {
                      item.speed = 0L
                      item.etaSec = -1L
                      item.err = ""
                      item.got = 0L
                      val dir = File(ctx.getExternalFilesDir(null) ?: ctx.filesDir, "yt_" + item.id)
                      dir.mkdirs()
                      startPoller(dir)
                      val out = try {
                          Ytdlp.download(ctx, item, dir, true) { p, eta, _ -> progress(p, eta) }
                      } catch (e: Exception) {
                          if (stop) throw e
                          // aria2c başarısız olursa yt-dlp'nin kendi indiricisiyle (parçalı) yeniden dene
                          dir.listFiles()?.filter { it.name.endsWith(".aria2") }?.forEach { it.delete() }
                          Ytdlp.download(ctx, item, dir, false) { p, eta, _ -> progress(p, eta) }
                      }
                      if (stop) {
                          item.status = "paused"
                          return
                      }
                      item.frac = 0.98f
                      onTick()
                      item.name = out.name
                      item.type = Store.typeOf(out.name, null)
                      item.total = out.length()
                      item.frac = 1f
                      Publisher.publish(ctx, item, out)
                      dir.deleteRecursively()
                      item.status = "done"
                  } catch (e: Exception) {
                      if (stop) {
                          item.status = "paused"
                      } else {
                          item.status = "error"
                          item.err = Ytdlp.shortErr(e.message ?: "hata")
                      }
                  } finally {
                      finished = true
                      item.etaSec = -1L
                      item.speed = 0L
                  }
              }
          }
