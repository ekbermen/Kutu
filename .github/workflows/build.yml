          cat > $P/Publisher.kt << 'EOF'
          package com.kutu.app

          import android.content.ContentValues
          import android.content.Context
          import android.net.Uri
          import android.provider.MediaStore
          import android.webkit.MimeTypeMap
          import java.io.File
          import java.io.IOException

          object Publisher {
              private fun insert(ctx: Context, item: Item, coll: Uri, rel: String, mime: String): Uri {
                  val v = ContentValues()
                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, item.name)
                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, rel)
                  v.put(MediaStore.MediaColumns.MIME_TYPE, mime)
                  v.put(MediaStore.MediaColumns.IS_PENDING, 1)
                  return ctx.contentResolver.insert(coll, v) ?: throw IOException("kayit acilamadi")
              }

              fun publish(ctx: Context, item: Item, file: File) {
                  val ext = item.name.substringAfterLast('.', "").lowercase()
                  val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext) ?: when (item.type) {
                      "video" -> "video/mp4"
                      "foto" -> "image/jpeg"
                      "muzik" -> "audio/mpeg"
                      else -> "application/octet-stream"
                  }
                  val vol = MediaStore.VOLUME_EXTERNAL_PRIMARY
                  val uri = try {
                      when (item.type) {
                          "video" -> insert(ctx, item, MediaStore.Video.Media.getContentUri(vol), "Movies/Kutu", mime)
                          "foto" -> insert(ctx, item, MediaStore.Images.Media.getContentUri(vol), "Pictures/Kutu", mime)
                          "muzik" -> insert(ctx, item, MediaStore.Audio.Media.getContentUri(vol), "Music/Kutu", mime)
                          else -> insert(ctx, item, MediaStore.Downloads.getContentUri(vol), "Download/Kutu", mime)
                      }
                  } catch (e: Exception) {
                      insert(ctx, item, MediaStore.Downloads.getContentUri(vol), "Download/Kutu", mime)
                  }
                  ctx.contentResolver.openOutputStream(uri)!!.use { o ->
                      file.inputStream().use { it.copyTo(o, 65536) }
                  }
                  val v = ContentValues()
                  v.put(MediaStore.MediaColumns.IS_PENDING, 0)
                  ctx.contentResolver.update(uri, v, null, null)
                  file.delete()
                  item.uri = uri.toString()
              }
          }
