          cat > $P/Ytdlp.kt << 'EOF'
          package com.kutu.app

          import android.content.Context
          import android.net.Uri
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import org.json.JSONObject
          import java.io.File
          import java.io.IOException

          class YInfo(
              val title: String,
              val uploader: String,
              val duration: Long,
              val thumb: String?,
              val heights: List<Int>,
              val sizes: Map<Int, Long>,
              val audioSize: Long,
              val portrait: Boolean,
              val live: Boolean
          )

          object Ytdlp {
              @Volatile private var ready = false
              @Volatile var status = "yt-dlp bekliyor"
              @Volatile var updating = false
              @Volatile var lastLog = ""
              @Volatile var ariaOk = false
              @Volatile var seeded = false
              @Volatile var onStatus: ((String) -> Unit)? = null
              private val lock = Any()
              private var qjs: String? = null
              private var qjsDone = false

              private val hosts = Regex(
                  "(youtube\\.com|youtu\\.be|tiktok\\.com|instagram\\.com|facebook\\.com|fb\\.watch|twitter\\.com|x\\.com|" +
                      "vimeo\\.com|dailymotion\\.com|reddit\\.com|redd\\.it|twitch\\.tv|soundcloud\\.com|pinterest\\.|pin\\.it|bilibili\\.com|" +
                      "snapchat\\.com|vk\\.com|ok\\.ru|streamable\\.com|imgur\\.com|bsky\\.app|threads\\.net|kick\\.com|rumble\\.com)",
                  RegexOption.IGNORE_CASE
              )

              fun isPlatform(u: String): Boolean = u.contains(".m3u8", true) || hosts.containsMatchIn(Uri.parse(u).host ?: "")

              private fun setStatus(s: String) {
                  status = s
                  onStatus?.invoke(s)
              }

              // Uygulama açılır açılmaz arka planda hazırlar: kullanıcı link yapıştırdığında hazır olur
              fun warm(ctx: Context) {
                  Thread {
                      try {
                          ensure(ctx)
                      } catch (e: Exception) {
                          lastLog = "init hata: " + e.message
                          setStatus("yt-dlp hata")
                      }
                  }.start()
              }

              fun ensure(ctx: Context) {
                  if (ready) return
                  synchronized(lock) {
                      if (ready) return
                      val app = ctx.applicationContext
                      setStatus("yt-dlp kuruluyor…")
                      YoutubeDL.getInstance().init(app)
                      try {
                          val fk = Class.forName("com.yausername.ffmpeg.FFmpeg")
                          val fi = fk.getMethod("getInstance").invoke(null)
                          fk.getMethod("init", Context::class.java).invoke(fi, app)
                      } catch (e: Exception) {
                          lastLog = "ffmpeg init hata: " + e.message
                      }
                      try {
                          val k = Class.forName("com.yausername.aria2c.Aria2c")
                          val inst = k.getMethod("getInstance").invoke(null)
                          k.getMethod("init", Context::class.java).invoke(inst, app)
                          ariaOk = true
                      } catch (e: Exception) {
                          ariaOk = false
                      }
                      seeded = seed(app)
                      ready = true
                      setStatus("yt-dlp hazır ✓")
                      bgUpdate(app)
                  }
              }

              private fun findFile(root: File, name: String, minLen: Long): File? {
                  if (!root.exists()) return null
                  for (f in root.walkTopDown().maxDepth(5)) {
                      if (f.isFile && f.name == name && f.length() > minLen) return f
                  }
                  return null
              }

              // APK'nın içine derleme sırasında konan en son yt-dlp'yi, kurulumdan sonra ilk açılışta devreye alır
              private fun seed(app: Context): Boolean {
                  try {
                      val pi = app.packageManager.getPackageInfo(app.packageName, 0)
                      val key = "seed" + pi.lastUpdateTime
                      val p = app.getSharedPreferences("kutu", 0)
                      if (p.getBoolean(key, false)) return true
                      val target = findFile(app.noBackupFilesDir, "yt-dlp", 500000L) ?: return false
                      var ok = false
                      try {
                          app.assets.open("yt-dlp").use { ins -> target.outputStream().use { ins.copyTo(it) } }
                          ok = true
                      } catch (e: Exception) {
                      }
                      p.edit().putBoolean(key, true).apply()
                      if (ok) p.edit().putLong("ytupd", System.currentTimeMillis()).apply()
                      return ok
                  } catch (e: Exception) {
                      return false
                  }
              }

              private fun bgUpdate(app: Context) {
                  val p = app.getSharedPreferences("kutu", 0)
                  val last = p.getLong("ytupd", 0L)
                  if (last != 0L && System.currentTimeMillis() - last < 43200000L) return
                  updating = true
                  Thread {
                      setStatus("yt-dlp güncelleniyor…")
                      val ok = update(app)
                      if (ok) p.edit().putLong("ytupd", System.currentTimeMillis()).apply()
                      updating = false
                      setStatus("yt-dlp hazır ✓")
                  }.start()
              }

              private fun waitUpdate(ms: Long) {
                  val end = System.currentTimeMillis() + ms
                  while (updating && System.currentTimeMillis() < end) {
                      try {
                          Thread.sleep(200)
                      } catch (e: InterruptedException) {
                          return
                      }
                  }
              }

              // API sürümler arasında değişebildiği için yansıma ile çağrılır
              private fun update(app: Context): Boolean {
                  try {
                      val y = YoutubeDL.getInstance()
                      for (m in y.javaClass.methods) {
                          if (m.name != "updateYoutubeDL") continue
                          val pt = m.parameterTypes
                          try {
                              if (pt.size == 1) {
                                  m.invoke(y, app)
                                  return true
                              }
                              if (pt.size == 2) {
                                  val ch = pt[1]
                                  var st: Any? = null
                                  for (f in ch.fields) {
                                      if (f.name == "_STABLE" || f.name == "STABLE") st = f.get(null)
                                  }
                                  if (st == null) {
                                      for (k in ch.declaredClasses) {
                                          if (k.simpleName == "STABLE") st = k.getField("INSTANCE").get(null)
                                      }
                                  }
                                  if (st != null) {
                                      m.invoke(y, app, st)
                                      return true
                                  }
                              }
                          } catch (e: Exception) {
                              lastLog = "güncelleme hata: " + e.message
                          }
                      }
                  } catch (e: Exception) {
                  }
                  return false
              }

              private fun qjsPath(ctx: Context): String? {
                  if (qjsDone) return qjs
                  var best: File? = null
                  var score = -1
                  val d = File(ctx.applicationInfo.nativeLibraryDir)
                  val fs = d.listFiles()
                  if (fs != null) {
                      for (f in fs) {
                          val n = f.name.lowercase()
                          if (!(n.contains("qjs") || n.contains("quickjs"))) continue
                          if (n.contains(".zip")) continue
                          val s = if (n == "libqjs.so") 3 else if (n.startsWith("libqjs")) 2 else 1
                          if (s > score) {
                              score = s
                              best = f
                          }
                      }
                  }
                  qjs = best?.absolutePath
                  qjsDone = true
                  return qjs
              }

              private fun base(ctx: Context, req: YoutubeDLRequest) {
                  req.addOption("--no-playlist")
                  req.addOption("--socket-timeout", "20")
                  req.addOption("--retries", "10")
                  req.addOption("--fragment-retries", "10")
                  req.addOption("--cache-dir", File(ctx.noBackupFilesDir, "ytcache").absolutePath)
                  val js = qjsPath(ctx)
                  if (js != null) req.addOption("--js-runtimes", "quickjs:" + js)
              }

              private fun proxy(t: Class<*>, cb: ((Float, Long, String) -> Unit)?): Any {
                  val h = java.lang.reflect.InvocationHandler { _, m, a ->
                      when (m.name) {
                          "hashCode" -> 0
                          "equals" -> false
                          "toString" -> "kutu-cb"
                          else -> {
                              val p = (a?.getOrNull(0) as? Number)?.toFloat() ?: -1f
                              val e = (a?.getOrNull(1) as? Number)?.toLong() ?: -1L
                              val l = (a?.getOrNull(2) as? String) ?: ""
                              cb?.invoke(p, e, l)
                              null
                          }
                      }
                  }
                  return java.lang.reflect.Proxy.newProxyInstance(t.classLoader, arrayOf(t), h)
              }

              private fun exec(req: YoutubeDLRequest, pid: String?, cb: ((Float, Long, String) -> Unit)?): Any? {
                  val y = YoutubeDL.getInstance()
                  val ms = y.javaClass.methods.filter { it.name == "execute" }.sortedByDescending { it.parameterTypes.size }
                  for (m in ms) {
                      val pt = m.parameterTypes
                      if (pt.isEmpty() || !pt[0].isAssignableFrom(YoutubeDLRequest::class.java)) continue
                      val args = arrayOfNulls<Any>(pt.size)
                      var ok = true
                      for (i in 1 until pt.size) {
                          val t = pt[i]
                          if (t == String::class.java) {
                              args[i] = pid
                          } else if (t == java.lang.Boolean.TYPE || t == java.lang.Boolean::class.java) {
                              args[i] = false
                          } else if (t.isInterface) {
                              args[i] = proxy(t, cb)
                          } else {
                              ok = false
                          }
                      }
                      if (!ok) continue
                      args[0] = req
                      try {
                          return m.invoke(y, *args)
                      } catch (e: java.lang.reflect.InvocationTargetException) {
                          val te = e.targetException
                          if (te is Exception) throw te
                          throw e
                      }
                  }
                  throw IOException("yt-dlp çalıştırma yöntemi bulunamadı")
              }

              private fun strOf(r: Any?, getter: String): String {
                  if (r == null) return ""
                  return try {
                      (r.javaClass.getMethod(getter).invoke(r) as? String) ?: ""
                  } catch (e: Exception) {
                      ""
                  }
              }

              fun report(): String =
                  "Kutu yt-dlp raporu\ndurum=" + status + "\njs=" + (qjs ?: "yok") + "\naria2=" + ariaOk +
                      "\nAPK-içi-yt-dlp=" + seeded + "\n---\n" + lastLog.takeLast(3500)

              fun shortErr(m: String): String {
                  val lines = m.trim().lines()
                  val l = lines.lastOrNull { it.contains("ERROR") } ?: lines.lastOrNull() ?: m
                  return l.replace(Regex("^.*ERROR:\\s*"), "").take(220)
              }

              fun cancel(id: String) {
                  try {
                      YoutubeDL.getInstance().destroyProcessById(id)
                  } catch (e: Exception) {
                  }
              }

              fun selector(key: String, portrait: Boolean): String {
                  if (key == "audio") return "audio"
                  val dim = if (portrait) "width" else "height"
                  if (key.startsWith("q")) {
                      val q = key.substring(1)
                      return "bv*[" + dim + "<=" + q + "]+ba/b[" + dim + "<=" + q + "]/b"
                  }
                  return "bv*+ba/b"
              }

              fun estimate(y: YInfo, key: String): Long {
                  if (key == "audio") return y.audioSize
                  if (key == "best") return y.sizes[y.heights.firstOrNull() ?: 0] ?: 0L
                  if (key.startsWith("q")) {
                      val q = key.substring(1).toIntOrNull() ?: 0
                      val k = y.sizes.keys.filter { it <= q }.maxOrNull()
                      return if (k != null) (y.sizes[k] ?: 0L) else 0L
                  }
                  return 0L
              }

              fun info(ctx: Context, url: String): YInfo {
                  ensure(ctx)
                  if (url.contains("youtu", true)) waitUpdate(20000L)
                  val req = YoutubeDLRequest(url)
                  req.addOption("--dump-single-json")
                  base(ctx, req)
                  val txt = try {
                      val r = exec(req, null, null)
                      lastLog = "INFO " + url + "\n" + strOf(r, "getErr")
                      strOf(r, "getOut").trim()
                  } catch (e: Exception) {
                      lastLog = "INFO " + url + "\n" + (e.message ?: "")
                      throw e
                  }
                  val at = txt.indexOf('{')
                  if (at < 0) throw IOException("Bilgi alınamadı")
                  var j = JSONObject(txt.substring(at))
                  if (!j.has("formats") && j.has("entries")) {
                      val es = j.optJSONArray("entries")
                      if (es != null) {
                          for (i in 0 until es.length()) {
                              val e = es.optJSONObject(i)
                              if (e != null) {
                                  j = e
                                  break
                              }
                          }
                      }
                  }
                  val vh = HashMap<Int, Long>()
                  val vo = HashMap<Int, Boolean>()
                  var audioBest = 0L
                  var por = 0
                  var land = 0
                  val fa = j.optJSONArray("formats")
                  if (fa != null) {
                      for (i in 0 until fa.length()) {
                          val f = fa.optJSONObject(i) ?: continue
                          val vc = f.optString("vcodec", "none")
                          val ac = f.optString("acodec", "none")
                          val hasV = vc != "none" && vc != "null" && vc.isNotEmpty()
                          val hasA = ac != "none" && ac != "null" && ac.isNotEmpty()
                          val size = maxOf(f.optLong("filesize", 0L), f.optLong("filesize_approx", 0L))
                          val h = f.optInt("height", 0)
                          val w = f.optInt("width", 0)
                          if (hasV && h > 0) {
                              val vertical = w in 1 until h
                              if (vertical) por++ else land++
                              val side = if (vertical) w else h
                              val cur = vh[side] ?: -1L
                              if (size > cur) {
                                  vh[side] = size
                                  vo[side] = !hasA
                              }
                          } else if (hasA && !hasV) {
                              audioBest = maxOf(audioBest, size)
                          }
                      }
                  }
                  val sizes = HashMap<Int, Long>()
                  for ((side, s) in vh) {
                      sizes[side] = if (s > 0L) s + (if (vo[side] == true) audioBest else 0L) else 0L
                  }
                  val heights = vh.keys.filter { it >= 100 }.sortedDescending()
                  var th: String? = j.optString("thumbnail", "")
                  if (th == null || th.isEmpty() || th == "null") th = null
                  var up = j.optString("uploader", "")
                  if (up.isEmpty() || up == "null") up = j.optString("channel", "")
                  if (up == "null") up = ""
                  return YInfo(
                      j.optString("title", "Video"),
                      up,
                      j.optDouble("duration", 0.0).toLong(),
                      th,
                      heights,
                      sizes,
                      audioBest,
                      por > land,
                      j.optBoolean("is_live", false)
                  )
              }

              fun download(ctx: Context, item: Item, dir: File, aria: Boolean, cb: (Float, Long, String) -> Unit): File {
                  ensure(ctx)
                  dir.mkdirs()
                  val req = YoutubeDLRequest(item.url)
                  base(ctx, req)
                  req.addOption("-o", dir.absolutePath + "/%(title).120B.%(ext)s")
                  req.addOption("--no-mtime")
                  req.addOption("--concurrent-fragments", "8")
                  req.addOption("--throttled-rate", "100K")
                  if (aria && ariaOk) {
                      // aria2c: aynı dosyayı 16 paralel bağlantıyla indirir
                      req.addOption("--downloader", "libaria2c.so")
                      req.addOption("--downloader-args", "aria2c:-x 16 -s 16 -k 1M --file-allocation=none")
                  } else {
                      req.addOption("--http-chunk-size", "10M")
                  }
                  if (item.sel == "audio") {
                      req.addOption("-f", "ba/b")
                      req.addOption("-x")
                      req.addOption("--audio-format", "mp3")
                      req.addOption("--audio-quality", "0")
                  } else {
                      req.addOption("-f", item.sel)
                      req.addOption("-S", "res,vcodec:h264,acodec:m4a")
                      req.addOption("--merge-output-format", "mp4/mkv")
                  }
                  try {
                      val r = exec(req, item.id, cb)
                      lastLog = "DL " + item.url + " aria=" + (aria && ariaOk) + "\n" + strOf(r, "getErr")
                  } catch (e: Exception) {
                      lastLog = "DL " + item.url + " aria=" + (aria && ariaOk) + "\n" + (e.message ?: "")
                      throw e
                  }
                  val files = dir.listFiles()?.filter {
                      it.isFile && !it.name.endsWith(".part") && !it.name.endsWith(".ytdl") &&
                          !it.name.endsWith(".aria2") && !it.name.contains(".temp.") && !it.name.endsWith(".frag")
                  }
                  return files?.maxByOrNull { it.length() } ?: throw IOException("Dosya bulunamadı")
              }
          }
          EOF

      - name: Son yt-dlp surumunu APK icine koy
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 -o app/src/main/assets/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp || true
          if [ -f app/src/main/assets/yt-dlp ] && [ "$(stat -c%s app/src/main/assets/yt-dlp)" -lt 1000000 ]; then rm -f app/src/main/assets/yt-dlp; fi
          ls -la app/src/main/assets || true

      - name: APK derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: Kutu-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release olustur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kutu build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
