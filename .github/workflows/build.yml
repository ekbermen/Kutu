name: Kutu APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Proje dosyalarini uret
        run: |
          P=app/src/main/java/com/kutu/app
          mkdir -p $P app/src/main/res/drawable

          cat > settings.gradle.kts << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Kutu"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx4g
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.kutu.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.kutu.app"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 5
                  versionName = "4.1"
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              packaging {
                  jniLibs { useLegacyPackaging = true }
                  resources {
                      excludes += setOf("META-INF/DEPENDENCIES", "META-INF/LICENSE", "META-INF/LICENSE.txt", "META-INF/NOTICE", "META-INF/NOTICE.txt", "META-INF/AL2.0", "META-INF/LGPL2.1", "META-INF/INDEX.LIST")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("com.google.zxing:core:3.5.3")
              implementation("com.google.android.gms:play-services-code-scanner:16.1.0")
              implementation("io.github.junkfood02.youtubedl-android:library:0.18.1")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1")
              implementation("io.github.junkfood02.youtubedl-android:aria2c:0.18.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:label="Kutu"
                  android:icon="@drawable/ic_kutu"
                  android:extractNativeLibs="true"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
                  <service android:name=".DownloadService" android:exported="false" android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/ic_kutu.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0D0D0D" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#1C1C1C" android:strokeColor="#E53935" android:strokeWidth="2" android:pathData="M28,52h52v36h-52z" />
              <path android:fillColor="#E53935" android:pathData="M28,70h26v18h-26z" />
              <path android:fillColor="#E53935" android:pathData="M22,40h64v12h-64z" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_stat.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M3,7h18v4h-18z M4,12h16v8h-16z" />
          </vector>
          EOF

          cat > $P/BoxView.kt << 'EOF'
          package com.kutu.app

          import android.animation.ObjectAnimator
          import android.animation.TimeInterpolator
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.view.View
          import android.view.animation.BounceInterpolator

          object BoxArt {
              fun draw(c: Canvas, w: Float, p: Float, lid: Float, fill: Int, lidCol: Int) {
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                  val gap = w * 0.03f
                  val bx = w * 0.08f
                  val by = w * 0.42f
                  val bw = w * 0.84f
                  val bh = w * 0.52f
                  val cw = (bw - gap) / 2f
                  val ch = (bh - gap) / 2f
                  val rad = w * 0.03f
                  for (i in 0 until 4) {
                      val l = bx + (i % 2) * (cw + gap)
                      val t = by + (i / 2) * (ch + gap)
                      val r = RectF(l, t, l + cw, t + ch)
                      paint.style = Paint.Style.FILL
                      paint.color = Color.parseColor("#1C1C1C")
                      c.drawRoundRect(r, rad, rad, paint)
                      val q = ((p - i * 0.25f) / 0.25f).coerceIn(0f, 1f)
                      if (q > 0f) {
                          c.save()
                          c.clipRect(l, t + ch * (1f - q), l + cw, t + ch)
                          paint.color = fill
                          c.drawRoundRect(r, rad, rad, paint)
                          c.restore()
                      }
                      paint.style = Paint.Style.STROKE
                      paint.strokeWidth = w * 0.012f
                      paint.color = fill
                      paint.alpha = 150
                      c.drawRoundRect(r, rad, rad, paint)
                  }
                  c.save()
                  c.rotate(-16f * (1f - lid), w * 0.04f, by)
                  paint.style = Paint.Style.FILL
                  paint.color = lidCol
                  c.drawRoundRect(RectF(w * 0.04f, w * 0.30f, w * 0.96f, by), rad, rad, paint)
                  c.restore()
              }

              fun bitmap(p: Float, lid: Float, fill: Int, lidCol: Int, size: Int = 192): Bitmap {
                  val b = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                  draw(Canvas(b), size.toFloat(), p, lid, fill, lidCol)
                  return b
              }
          }

          class BoxView(ctx: Context) : View(ctx) {
              var inset = 0f
              var quiet = false
              private var shownP = 0f
              private var lid = 0f
              private var tp = 0f
              private var tl = 0f
              private var col = Color.RED
              private var inited = false
              private var lidSound = false
              private var pa: ValueAnimator? = null
              private var la: ValueAnimator? = null
              private var wob: ObjectAnimator? = null

              fun show(p: Float, done: Boolean, color: Int) {
                  col = color
                  val l = if (done) 1f else 0f
                  if (!inited) {
                      inited = true
                      shownP = p
                      tp = p
                      lid = l
                      tl = l
                      invalidate()
                      return
                  }
                  if (p != tp) {
                      tp = p
                      pa?.cancel()
                      pa = ValueAnimator.ofFloat(shownP, p).apply {
                          duration = 450
                          addUpdateListener {
                              val v = it.animatedValue as Float
                              if (!quiet && v < 0.999f && (v * 4).toInt() > (shownP * 4).toInt()) Sfx.tick(this@BoxView)
                              shownP = v
                              invalidate()
                          }
                          start()
                      }
                  }
                  if (l != tl) {
                      tl = l
                      lidSound = false
                      la?.cancel()
                      la = ValueAnimator.ofFloat(lid, l).apply {
                          duration = 900
                          interpolator = BounceInterpolator()
                          addUpdateListener {
                              lid = it.animatedValue as Float
                              if (done && !lidSound && lid >= 0.97f) {
                                  lidSound = true
                                  if (!quiet) Sfx.lid(this@BoxView)
                              }
                              invalidate()
                          }
                          start()
                      }
                      if (done) {
                          animate().scaleX(1.18f).scaleY(1.18f).setDuration(160).withEndAction {
                              animate().scaleX(1f).scaleY(1f).setDuration(220).start()
                          }.start()
                      }
                  }
                  invalidate()
              }

              fun animLid(to: Float, dur: Long, ip: TimeInterpolator) {
                  la?.cancel()
                  tl = to
                  la = ValueAnimator.ofFloat(lid, to).apply {
                      duration = dur
                      interpolator = ip
                      addUpdateListener {
                          lid = it.animatedValue as Float
                          invalidate()
                      }
                      start()
                  }
              }

              fun wobble(on: Boolean) {
                  wob?.cancel()
                  wob = null
                  rotation = 0f
                  if (on) {
                      wob = ObjectAnimator.ofFloat(this, "rotation", -7f, 7f).apply {
                          duration = 350
                          repeatMode = ValueAnimator.REVERSE
                          repeatCount = ValueAnimator.INFINITE
                          start()
                      }
                  }
              }

              override fun onDraw(c: Canvas) {
                  val s = minOf(width, height).toFloat()
                  val a = s * (1f - inset)
                  c.save()
                  c.translate((width - a) / 2f, height - a)
                  BoxArt.draw(c, a, shownP, lid, col, col)
                  c.restore()
              }
          }

          class Sparks(ctx: Context) : View(ctx) {
              private class P(val x: Float, val y: Float, val vx: Float, val vy: Float, val c: Int, val r: Float)

              private val ps = ArrayList<P>()
              private var t = 0f
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private var anim: ValueAnimator? = null

              fun burst(cx: Float, cy: Float, colors: IntArray, n: Int = 40) {
                  ps.clear()
                  val rnd = java.util.Random()
                  for (i in 0 until n) {
                      val a = rnd.nextDouble() * 2.0 * Math.PI
                      val sp = 300f + rnd.nextFloat() * 700f
                      ps.add(
                          P(
                              cx, cy,
                              Math.cos(a).toFloat() * sp, Math.sin(a).toFloat() * sp - 300f,
                              colors[i % colors.size], 4f + rnd.nextFloat() * 8f
                          )
                      )
                  }
                  anim?.cancel()
                  anim = ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = 1400
                      addUpdateListener {
                          t = it.animatedValue as Float
                          invalidate()
                      }
                      start()
                  }
              }

              override fun onDraw(c: Canvas) {
                  val sec = t * 1.4f
                  for (p in ps) {
                      val x = p.x + p.vx * sec
                      val y = p.y + p.vy * sec + 900f * sec * sec
                      paint.color = p.c
                      paint.alpha = ((1f - t) * 255).toInt().coerceIn(0, 255)
                      c.drawCircle(x, y, p.r * (1f - t * 0.5f), paint)
                  }
              }
          }
          EOF

          cat > $P/DownloadService.kt << 'EOF'
          package com.kutu.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import androidx.core.app.NotificationCompat
          import java.util.concurrent.ConcurrentHashMap

          class DownloadService : Service() {
              private val jobs = ConcurrentHashMap<String, Job>()
              private val main = Handler(Looper.getMainLooper())
              private lateinit var nm: NotificationManager
              private val red = Color.parseColor("#E53935")

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  Store.load(this)
                  nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("fg", "Kutu çalışıyor", NotificationManager.IMPORTANCE_MIN))
                  nm.createNotificationChannel(NotificationChannel("dl", "İndirmeler", NotificationManager.IMPORTANCE_LOW))
              }

              override fun onStartCommand(i: Intent?, flags: Int, startId: Int): Int {
                  startForeground(1, fgNotif(), ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  val id = i?.getStringExtra("id")
                  val item = Store.items.firstOrNull { it.id == id }
                  when (i?.action) {
                      "add", "resume" -> if (item != null && !jobs.containsKey(item.id)) start(item)
                      "pause" -> id?.let { jobs[it]?.pause() }
                  }
                  idle()
                  return START_NOT_STICKY
              }

              private fun start(item: Item) {
                  item.status = "running"
                  val d: Job = if (item.engine == "ytdlp") YtJob(this, item, { tick(item) }) else Downloader(this, item, { tick(item) })
                  jobs[item.id] = d
                  tick(item)
                  Thread {
                      d.run()
                      main.post {
                          jobs.remove(item.id)
                          Store.save(this)
                          tick(item)
                          idle()
                      }
                  }.start()
              }

              private fun idle() {
                  if (jobs.isEmpty()) {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf()
                  } else {
                      nm.notify(1, fgNotif())
                  }
              }

              private fun tick(item: Item) {
                  val nid = item.id.hashCode() + 2
                  if (!Store.items.contains(item)) {
                      nm.cancel(nid)
                      return
                  }
                  nm.notify(nid, notif(item))
                  Store.changed()
              }

              private fun fgNotif(): Notification =
                  NotificationCompat.Builder(this, "fg")
                      .setSmallIcon(R.drawable.ic_stat)
                      .setContentTitle("Kutu")
                      .setContentText(jobs.size.toString() + " indirme sürüyor")
                      .setOngoing(true)
                      .build()

              private fun act(a: String, item: Item): PendingIntent =
                  PendingIntent.getForegroundService(
                      this, item.id.hashCode() * 31 + a.hashCode(),
                      Intent(this, DownloadService::class.java).setAction(a).putExtra("id", item.id),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

              private fun notif(item: Item): Notification {
                  val done = item.status == "done"
                  val p = if (done) 1f else item.fraction()
                  val b = NotificationCompat.Builder(this, "dl")
                      .setSmallIcon(R.drawable.ic_stat)
                      .setContentTitle(item.name)
                      .setContentText(Store.short(item))
                      .setStyle(NotificationCompat.BigTextStyle().bigText(Store.info(item)))
                      .setLargeIcon(BoxArt.bitmap(p, if (done) 1f else 0f, red, red))
                      .setOnlyAlertOnce(true)
                      .setOngoing(item.status == "running")
                      .setAutoCancel(done)
                      .setContentIntent(
                          PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                      )
                  if (item.status == "running") b.addAction(0, "Duraklat", act("pause", item))
                  if (item.status == "paused" || item.status == "error") b.addAction(0, "Devam", act("resume", item))
                  return b.build()
              }
          }
          EOF

          cat > $P/Downloader.kt << 'EOF'
          package com.kutu.app

          import android.content.ContentValues
          import android.content.Context
          import android.net.Uri
          import android.provider.MediaStore
          import android.webkit.MimeTypeMap
          import java.io.File
          import java.io.IOException
          import java.io.RandomAccessFile
          import java.net.HttpURLConnection
          import java.util.concurrent.CopyOnWriteArraySet
          import java.util.concurrent.atomic.AtomicInteger

          class Downloader(private val ctx: Context, private val item: Item, private val onTick: () -> Unit) : Job {
              @Volatile private var stop = false
              @Volatile private var failed: Exception? = null
              private val conns = CopyOnWriteArraySet<HttpURLConnection>()
              private val segN = 8
              private val claimed = BooleanArray(segN)
              private val lk = Any()
              @Volatile private var target = 4
              private val active = AtomicInteger(0)
              private val errs = AtomicInteger(0)
              private var ps = 1L
              private var lastTick = 0L
              private var lastSave = 0L
              private var lastBytes = 0L
              private var lastAdapt = 0L
              private var baseSpeed = -1L
              private var ramp = true

              override fun pause() {
                  stop = true
                  for (c in conns) {
                      try {
                          c.disconnect()
                      } catch (e: Exception) {
                      }
                  }
              }

              override fun run() {
                  try {
                      item.speed = 0L
                      if (!item.probed) {
                          val i = Net.probe(item.url)
                          if (i.isPage) throw IOException("sayfa")
                          item.name = i.name
                          item.type = i.type
                          item.total = i.total
                          item.ranges = i.ranges
                          item.probed = true
                      }
                      val tmp = Store.tmp(ctx, item.id)
                      val usable = item.ranges && item.total > 0
                      if (usable) {
                          if (item.done() == 0L || !tmp.exists()) {
                              item.parts = LongArray(segN)
                              tmp.delete()
                          }
                          RandomAccessFile(tmp, "rw").use { it.setLength(item.total) }
                          ps = (item.total + segN - 1) / segN
                          if (item.total < 8L * 1048576L) ramp = false
                          lastAdapt = System.currentTimeMillis()
                          val threads = ArrayList<Thread>()
                          while (!stop && failed == null && item.done() < item.total) {
                              while (active.get() < target && hasWork()) spawn(tmp, threads)
                              item.conn = active.get()
                              adapt()
                              try {
                                  Thread.sleep(300)
                              } catch (e: InterruptedException) {
                              }
                          }
                          for (t in threads) t.join()
                      } else {
                          single(tmp)
                      }
                      val f = failed
                      if (f != null) throw f
                      if (stop) {
                          item.status = "paused"
                          return
                      }
                      if (item.total <= 0) item.total = item.done()
                      if (item.done() < item.total) throw IOException("eksik")
                      publish(tmp)
                      item.status = "done"
                  } catch (e: Exception) {
                      item.status = if (failed == null && stop) "paused" else "error"
                  } finally {
                      item.conn = 0
                  }
              }

              private fun open(from: Long, to: Long): HttpURLConnection {
                  val c = Net.open(item.url, from, to)
                  conns.add(c)
                  return c
              }

              private fun segStart(i: Int): Long = i * ps
              private fun segEnd(i: Int): Long = minOf(item.total - 1, i * ps + ps - 1)
              private fun segLen(i: Int): Long = maxOf(0L, segEnd(i) - segStart(i) + 1)

              private fun claim(): Int {
                  synchronized(lk) {
                      for (i in 0 until segN) {
                          if (!claimed[i] && item.parts[i] < segLen(i)) {
                              claimed[i] = true
                              return i
                          }
                      }
                  }
                  return -1
              }

              private fun release(i: Int) {
                  synchronized(lk) { claimed[i] = false }
              }

              private fun hasWork(): Boolean {
                  synchronized(lk) {
                      for (i in 0 until segN) {
                          if (!claimed[i] && item.parts[i] < segLen(i)) return true
                      }
                  }
                  return false
              }

              private fun spawn(tmp: File, list: MutableList<Thread>) {
                  active.incrementAndGet()
                  val t = Thread {
                      try {
                          worker(tmp)
                      } finally {
                          active.decrementAndGet()
                      }
                  }
                  list.add(t)
                  t.start()
              }

              private fun worker(tmp: File) {
                  while (!stop && failed == null) {
                      val i = claim()
                      if (i < 0) return
                      val finished = seg(i, tmp)
                      if (!finished) {
                          release(i)
                          return
                      }
                      if (active.get() > target) return
                  }
              }

              private fun seg(i: Int, tmp: File): Boolean {
                  val start = segStart(i)
                  val end = segEnd(i)
                  var fails = 0
                  while (!stop && start + item.parts[i] <= end) {
                      try {
                          val pos = start + item.parts[i]
                          val c = open(pos, end)
                          try {
                              if (c.responseCode != 206) throw IOException("HTTP " + c.responseCode)
                              RandomAccessFile(tmp, "rw").use { raf ->
                                  raf.seek(pos)
                                  val ins = c.inputStream
                                  val buf = ByteArray(65536)
                                  while (!stop) {
                                      val n = ins.read(buf)
                                      if (n < 0) break
                                      raf.write(buf, 0, n)
                                      item.parts[i] += n.toLong()
                                      tick()
                                  }
                              }
                          } finally {
                              conns.remove(c)
                              c.disconnect()
                          }
                          if (!stop && start + item.parts[i] <= end) throw IOException("erken bitti")
                          fails = 0
                      } catch (e: Exception) {
                          if (stop) return false
                          errs.incrementAndGet()
                          fails++
                          if (fails > 90) {
                              failed = e
                              pause()
                              return false
                          }
                          if (active.get() > target && fails >= 2) return false
                          try {
                              Thread.sleep(minOf(fails * 1500L, 10000L))
                          } catch (ie: InterruptedException) {
                          }
                      }
                  }
                  return !stop
              }

              private fun adapt() {
                  val now = System.currentTimeMillis()
                  if (now - lastAdapt < 4000L) return
                  lastAdapt = now
                  val s = item.speed
                  if (errs.getAndSet(0) >= 3) {
                      target = maxOf(2, target - 2)
                      ramp = false
                      return
                  }
                  if (!ramp) return
                  if (s > 6_000_000L) {
                      ramp = false
                      return
                  }
                  if (baseSpeed < 0L) {
                      baseSpeed = s
                      target = minOf(segN, target + 2)
                      return
                  }
                  if (s > baseSpeed * 12 / 10 && target < segN) {
                      baseSpeed = s
                      target = minOf(segN, target + 2)
                  } else {
                      if (s < baseSpeed * 105 / 100) target = maxOf(4, target - 2)
                      ramp = false
                  }
              }

              private fun single(tmp: File) {
                  var fails = 0
                  while (!stop) {
                      try {
                          item.parts = LongArray(segN)
                          tmp.delete()
                          val c = open(-1, -1)
                          var complete = false
                          try {
                              if (c.responseCode != 200) throw IOException("HTTP " + c.responseCode)
                              tmp.outputStream().use { out ->
                                  val ins = c.inputStream
                                  val buf = ByteArray(65536)
                                  while (!stop) {
                                      val n = ins.read(buf)
                                      if (n < 0) {
                                          complete = true
                                          break
                                      }
                                      out.write(buf, 0, n)
                                      item.parts[0] += n.toLong()
                                      tick()
                                  }
                              }
                          } finally {
                              conns.remove(c)
                              c.disconnect()
                          }
                          if (complete) return
                      } catch (e: Exception) {
                          if (stop) return
                          fails++
                          if (fails > 5) {
                              failed = e
                              return
                          }
                          try {
                              Thread.sleep(3000)
                          } catch (ie: InterruptedException) {
                          }
                      }
                  }
              }

              @Synchronized
              private fun tick() {
                  val now = System.currentTimeMillis()
                  if (now - lastTick < 500L) return
                  val d = item.done()
                  val inst = if (lastTick > 0L) (d - lastBytes) * 1000L / (now - lastTick) else 0L
                  item.speed = if (item.speed == 0L) inst else (item.speed * 7L + inst * 3L) / 10L
                  lastBytes = d
                  lastTick = now
                  if (now - lastSave > 3000L) {
                      lastSave = now
                      Store.save(ctx)
                  }
                  onTick()
              }

              private fun insert(coll: Uri, rel: String, mime: String): Uri {
                  val v = ContentValues()
                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, item.name)
                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, rel)
                  v.put(MediaStore.MediaColumns.MIME_TYPE, mime)
                  v.put(MediaStore.MediaColumns.IS_PENDING, 1)
                  return ctx.contentResolver.insert(coll, v) ?: throw IOException("kayit acilamadi")
              }

              private fun publish(tmp: File) {
                  val ext = item.name.substringAfterLast('.', "").lowercase()
                  val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext) ?: when (item.type) {
                      "video" -> "video/mp4"
                      "foto" -> "image/jpeg"
                      "muzik" -> "audio/mpeg"
                      else -> "application/octet-stream"
                  }
                  val vol = MediaStore.VOLUME_EXTERNAL_PRIMARY
                  val uri = try {
                      when (item.type) {
                          "video" -> insert(MediaStore.Video.Media.getContentUri(vol), "Movies/Kutu", mime)
                          "foto" -> insert(MediaStore.Images.Media.getContentUri(vol), "Pictures/Kutu", mime)
                          "muzik" -> insert(MediaStore.Audio.Media.getContentUri(vol), "Music/Kutu", mime)
                          else -> insert(MediaStore.Downloads.getContentUri(vol), "Download/Kutu", mime)
                      }
                  } catch (e: Exception) {
                      insert(MediaStore.Downloads.getContentUri(vol), "Download/Kutu", mime)
                  }
                  ctx.contentResolver.openOutputStream(uri)!!.use { o ->
                      tmp.inputStream().use { it.copyTo(o, 65536) }
                  }
                  val v = ContentValues()
                  v.put(MediaStore.MediaColumns.IS_PENDING, 0)
                  ctx.contentResolver.update(uri, v, null, null)
                  tmp.delete()
                  item.uri = uri.toString()
              }
          }
