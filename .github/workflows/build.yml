                      var r = rows[m.id]
                      if (r == null) {
                          r = makeRow(m.id)
                          rows[m.id] = r
                          list.addView(r.root, 0)
                          r.root.alpha = 0f
                          r.root.translationY = dp(28).toFloat()
                          r.root.animate().alpha(1f).translationY(0f)
                              .setStartDelay(minOf(n, 8) * 45L).setDuration(380)
                              .setInterpolator(DecelerateInterpolator()).start()
                      }
                      n++
                      val done = m.status == "done"
                      val p = if (done) 1f else m.fraction()
                      r.box.show(p, done, if (done) Store.typeColor(m.type) else C.red)
                      r.name.text = emoji(m.type) + " " + m.name
                      r.info.text = Store.info(m)
                      val running = m.status == "running" || m.status == "queued"
                      r.act.text = if (running) "⏸" else "▶"
                      r.act.visibility = if (done) View.GONE else View.VISIBLE
                      r.share.visibility = if (done) View.VISIBLE else View.GONE
                      r.barWrap.visibility = if (done) View.GONE else View.VISIBLE
                      r.bar.animate().scaleX(p).setDuration(350).start()
                  }
                  updateStats()
                  if (!arrivalBusy && overlay.visibility != View.VISIBLE) {
                      val a = Store.items.firstOrNull { it.qr && it.status == "done" && !it.seen }
                      if (a != null) {
                          a.seen = true
                          Store.save(this)
                          showArrival(a)
                      }
                  }
              }

              private fun updateStats() {
                  val d = Store.items.filter { it.status == "done" }
                  stats.text = d.size.toString() + " kutu · " + Store.fmt(d.sumOf { it.total.coerceAtLeast(0L) }) + " indirildi"
                  empty.visibility = if (rows.isEmpty()) View.VISIBLE else View.GONE
              }

              private fun svc(action: String, id: String) {
                  ContextCompat.startForegroundService(
                      this, Intent(this, DownloadService::class.java).setAction(action).putExtra("id", id)
                  )
              }

              private fun toggle(id: String) {
                  val m = Store.items.firstOrNull { it.id == id } ?: return
                  svc(if (m.status == "running" || m.status == "queued") "pause" else "resume", id)
              }

              private fun remove(id: String) {
                  val m = Store.items.firstOrNull { it.id == id } ?: return
                  if (m.status == "running") svc("pause", id)
                  Store.items.remove(m)
                  Store.tmp(this, id).delete()
                  getSystemService(NotificationManager::class.java).cancel(id.hashCode() + 2)
                  Store.save(this)
                  val row = rows.remove(id)
                  if (row != null) {
                      row.root.animate().alpha(0f).translationX(row.root.width.toFloat()).setDuration(250).withEndAction {
                          list.removeView(row.root)
                          updateStats()
                      }.start()
                  } else {
                      updateStats()
                  }
              }

              private fun openFile(id: String) {
                  val m = Store.items.firstOrNull { it.id == id } ?: return
                  if (m.status == "error") {
                      copyReport(m.err)
                      return
                  }
                  if (m.status != "done" || m.uri.isEmpty()) return
                  try {
                      val u = Uri.parse(m.uri)
                      startActivity(
                          Intent(Intent.ACTION_VIEW).setDataAndType(u, contentResolver.getType(u) ?: "*/*")
                              .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      )
                  } catch (e: Exception) {
                      toast("Açılamadı")
                  }
              }

              // ---------- ekleme ----------
              private fun addUrl(raw: String) {
                  val u = raw.trim()
                  if (u.startsWith("kutu://")) {
                      addItem("http://" + u.removePrefix("kutu://"), null, true)
                      return
                  }
                  if (!linkRe.matches(u)) {
                      toast("Geçerli bir link değil")
                      return
                  }
                  showPreview(u)
              }

              private fun addItem(url: String, info: Info?, qr: Boolean) {
                  val m = Item(UUID.randomUUID().toString(), url)
                  if (info != null) {
                      m.name = info.name
                      m.type = info.type
                      m.total = info.total
                      m.ranges = info.ranges
                      m.probed = true
                  } else {
                      m.name = Store.nameFromUrl(url)
                      m.type = Store.typeOf(m.name, null)
                  }
                  m.qr = qr
                  Store.items.add(0, m)
                  Store.save(this)
                  sync()
                  svc("add", m.id)
              }

              // ---------- overlay ----------
              private fun openOverlay(v: View) {
                  overlayGen++
                  overlay.animate().cancel()
                  overlay.removeAllViews()
                  overlay.addView(v)
                  overlay.visibility = View.VISIBLE
                  overlay.alpha = 0f
                  overlay.animate().alpha(1f).setDuration(220).start()
              }

              private fun closeOverlay(after: (() -> Unit)? = null) {
                  val oc = overlayClose
                  overlayClose = null
                  oc?.invoke()
                  val gen = ++overlayGen
                  overlay.animate().alpha(0f).setDuration(200).withEndAction {
                      if (gen == overlayGen) {
                          overlay.removeAllViews()
                          overlay.visibility = View.GONE
                          arrivalBusy = false
                          after?.invoke()
                          sync()
                      }
                  }.start()
              }

              // ---------- önce göster, sonra indir ----------
              private fun showPreview(url: String) {
                  val c = card()
                  val box = BoxView(this)
                  box.show(0f, false, C.red)
                  box.wobble(true)
                  c.addView(box, LinearLayout.LayoutParams(dp(96), dp(96)))
                  val title = tv("Kutu açılıyor…", 18f, Color.WHITE, true)
                  title.gravity = Gravity.CENTER
                  title.setPadding(0, dp(10), 0, dp(4))
                  val sub = tv(url, 11f, Color.GRAY)
                  sub.maxLines = 3
                  sub.gravity = Gravity.CENTER
                  sub.ellipsize = TextUtils.TruncateAt.MIDDLE
                  val extra = LinearLayout(this)
                  extra.orientation = LinearLayout.VERTICAL
                  extra.gravity = Gravity.CENTER_HORIZONTAL
                  c.addView(title)
                  c.addView(sub)
                  c.addView(extra, LinearLayout.LayoutParams(-1, -2))
                  val sv = ScrollView(this)
                  sv.isVerticalScrollBarEnabled = false
                  sv.addView(c)
                  sv.layoutParams = FrameLayout.LayoutParams(-1, -2, Gravity.CENTER)
                  openOverlay(sv)
                  c.scaleX = 0.85f
                  c.scaleY = 0.85f
                  c.alpha = 0f
                  c.animate().scaleX(1f).scaleY(1f).alpha(1f).setDuration(350)
                      .setInterpolator(OvershootInterpolator(1.3f)).start()
                  Thread {
                      var page = false
                      var perr: String? = null
                      if (!Ytdlp.isPlatform(url)) {
                          try {
                              val i = Net.probe(url)
                              if (!i.isPage) {
                                  runOnUiThread { fillPreview(url, i, box, title, sub, extra) }
                                  return@Thread
                              }
                              page = true
                          } catch (e: Exception) {
                              perr = e.message
                          }
                      }
                      runOnUiThread { ytFlow(url, box, title, sub, extra, page, perr) }
                  }.start()
              }

              private val ladder = listOf(
                  Pair(2160, "4K"), Pair(1440, "2K"), Pair(1080, "Full HD"), Pair(720, "HD"),
                  Pair(480, "480p"), Pair(360, "360p"), Pair(240, "240p"), Pair(144, "144p")
              )

              private fun copyReport(extra: String = "") {
                  val cm = getSystemService(ClipboardManager::class.java)
                  cm.setPrimaryClip(ClipData.newPlainText("kutu", Ytdlp.report() + (if (extra.isEmpty()) "" else "\n" + extra)))
                  toast("Rapor kopyalandı, bana yapıştır")
              }

              private fun roundOutline(r: Int): ViewOutlineProvider = object : ViewOutlineProvider() {
                  override fun getOutline(view: View, outline: Outline) {
                      outline.setRoundRect(0, 0, view.width, view.height, dp(r).toFloat())
                  }
              }

              private fun dur(s: Long): String {
                  if (s <= 0L) return ""
                  return if (s >= 3600L) String.format("%d:%02d:%02d", s / 3600L, (s % 3600L) / 60L, s % 60L)
                  else String.format("%d:%02d", s / 60L, s % 60L)
              }

              private fun labelOf(key: String): String = when {
                  key == "best" -> "En iyi"
                  key == "audio" -> "MP3"
                  else -> key.substring(1) + "p"
              }

              // Önce kapak+başlık anında gelir, kalite listesi yt-dlp analizi bitince dolar. "En iyi" ile hemen indirilebilir.
              private fun ytFlow(url0: String, box: BoxView, title: TextView, sub: TextView, extra: LinearLayout, page: Boolean, perr: String?) {
                  title.text = "🔎 Taranıyor…"
                  sub.text = "Önizleme alınıyor"
                  Thread {
                      var url = url0
                      try {
                          val host = Uri.parse(url).host ?: ""
                          if (host.contains("pin.it")) url = Net.resolve(url)
                      } catch (e: Exception) {
                      }
                      val u = url
                      val q = Net.quick(u)
                      var card: YtCard? = null
                      if (q != null) {
                          runOnUiThread {
                              val c0 = YtCard(u, box, title, sub, extra)
                              c0.build(q)
                              card = c0
                          }
                      }
                      try {
                          val yi = Ytdlp.info(this, u)
                          runOnUiThread {
                              var c1 = card
                              if (c1 == null) {
                                  c1 = YtCard(u, box, title, sub, extra)
                                  c1.build(null)
                                  card = c1
                              }
                              c1.showInfo(yi)
                          }
                      } catch (e: Exception) {
                          val msg = Ytdlp.shortErr(e.message ?: perr ?: "Detay alınamadı")
                          runOnUiThread {
                              val c2 = card
                              if (c2 != null && Ytdlp.isPlatform(u)) c2.fail(msg) else pageFlow(u, box, title, sub, extra, msg)
                          }
                      }
                  }.start()
              }

              private inner class YtCard(val url: String, val box: BoxView, val title: TextView, val sub: TextView, val extra: LinearLayout) {
                  var yi: YInfo? = null
                  var selKey = "best"
                  private val chips = LinkedHashMap<String, TextView>()
                  private val chipRow = LinearLayout(this@MainActivity)
                  private val sizeTv = tv("", 14f, Color.WHITE, true)
                  private val warnTv = tv("", 12f, Color.GRAY)
                  private val note = tv("Kaliteler yükleniyor…", 12f, Color.GRAY)
                  private val actions = LinearLayout(this@MainActivity)
                  private var img: ImageView? = null
                  private var reportAdded = false
                  private val free: Long = try {
                      StatFs((getExternalFilesDir(null) ?: filesDir).path).availableBytes
                  } catch (e: Exception) {
                      Long.MAX_VALUE
                  }

                  fun build(q: Quick?) {
                      box.wobble(false)
                      val c = extra.parent as LinearLayout
                      val im = ImageView(this@MainActivity)
                      im.scaleType = ImageView.ScaleType.CENTER_CROP
                      im.setBackgroundColor(Color.parseColor("#262626"))
                      im.clipToOutline = true
                      im.outlineProvider = roundOutline(16)
                      c.addView(im, 0, LinearLayout.LayoutParams(-1, dp(150)))
                      img = im
                      box.visibility = View.GONE
                      if (q != null) {
                          title.text = q.title
                          title.maxLines = 3
                          sub.text = q.author
                          sub.textSize = 13f
                          sub.setTextColor(Color.LTGRAY)
                          val tu = q.thumb
                          if (tu != null) {
                              Thread {
                                  val bm = Net.bitmap(tu)
                                  val iv = img
                                  if (bm != null && iv != null) runOnUiThread { iv.setImageBitmap(bm) }
                              }.start()
                          }
                      }
                      chipRow.gravity = Gravity.CENTER_VERTICAL
                      val hs = HorizontalScrollView(this@MainActivity)
                      hs.isHorizontalScrollBarEnabled = false
                      hs.addView(chipRow)
                      rebuild()
                      sizeTv.setPadding(0, dp(10), 0, 0)
                      warnTv.gravity = Gravity.CENTER
                      warnTv.setPadding(0, dp(4), 0, 0)
                      note.gravity = Gravity.CENTER
                      note.setPadding(0, dp(4), 0, 0)
                      actions.gravity = Gravity.CENTER
                      val hl = LinearLayout.LayoutParams(-1, -2)
                      hl.topMargin = dp(12)
                      extra.addView(hs, hl)
                      extra.addView(sizeTv)
                      extra.addView(warnTv)
                      extra.addView(note)
                      extra.addView(actions)
                      extra.addView(
                          btnRow(
                              btn("Vazgeç", false) { closeOverlay() },
                              btn("İndir", true) {
                                  val k = selKey
                                  val y = yi
                                  val nh = title.text.toString()
                                  closeOverlay { addYt(url, y, k, nh) }
                              }
                          )
                      )
                      extra.alpha = 0f
                      extra.animate().alpha(1f).setDuration(300).start()
                      refresh()
                  }

                  private fun rebuild() {
                      chipRow.removeAllViews()
                      chips.clear()
                      val l = ArrayList<Pair<String, String>>()
                      l.add(Pair("En iyi", "best"))
                      if (yi != null) {
                          for ((h, nm) in ladder) l.add(Pair(nm, "q" + h))
                      }
                      l.add(Pair("🎵 MP3", "audio"))
                      val maxH = yi?.heights?.firstOrNull() ?: 0
                      for ((label, key) in l) {
                          val t = tv(label, 13f, Color.LTGRAY, true)
                          t.setPadding(dp(14), dp(8), dp(14), dp(8))
                          val qh = if (key.startsWith("q")) (key.substring(1).toIntOrNull() ?: 0) else 0
                          t.alpha = if (qh > maxH) 0.45f else 1f
                          t.pressable()
                          t.setOnClickListener {
                              selKey = key
                              refresh()
                              pop(t)
                          }
                          chips[key] = t
                          val lp = LinearLayout.LayoutParams(-2, -2)
                          lp.setMargins(dp(4), 0, dp(4), 0)
                          chipRow.addView(t, lp)
                      }
                  }

                  fun refresh() {
                      for ((k, v) in chips) {
                          v.setTextColor(if (k == selKey) Color.WHITE else Color.LTGRAY)
                          v.background = pill(if (k == selKey) C.red else C.card, 16)
                      }
                      val y = yi
                      val est = if (y != null) Ytdlp.estimate(y, selKey) else 0L
                      sizeTv.text = if (est > 0L) "≈ " + Store.fmt(est) else if (y == null) "" else "boyut bilinmiyor"
                      if (est > 0L && est > free) {
                          warnTv.text = "⚠ Yetersiz alan: boş " + Store.fmt(free)
                          warnTv.setTextColor(C.red)
                      } else if (est > 0L && est * 2 > free) {
                          warnTv.text = "Alan dar: birleştirme sırasında geçici yer gerekir"
                          warnTv.setTextColor(Color.parseColor("#FB8C00"))
                      } else {
                          warnTv.text = "Boş alan: " + Store.fmt(free)
                          warnTv.setTextColor(Color.GRAY)
                      }
                  }

                  fun showInfo(info: YInfo) {
                      yi = info
                      title.text = info.title
                      title.maxLines = 3
                      sub.text = (if (info.uploader.isNotEmpty()) info.uploader + " · " else "") +
                          (if (info.live) "CANLI yayın" else dur(info.duration))
                      sub.textSize = 13f
                      sub.setTextColor(Color.LTGRAY)
                      val maxH = info.heights.firstOrNull() ?: 0
                      val yt = url.contains("youtu")
                      val low = yt && maxH in 1..480
                      note.text = if (maxH == 0) "Kalite bilgisi yok, en iyi seçilecek"
                      else "En yüksek kalite: " + maxH + "p" + (if (low) "\n⚠ YouTube HD formatları gelmedi (JS çözücü çalışmıyor olabilir)" else "")
                      if (low) addReportBtn()
                      rebuild()
                      refresh()
                  }

                  private fun addReportBtn() {
                      if (reportAdded) return
                      reportAdded = true
                      actions.addView(btn("📋 Rapor", false) { copyReport(url) })
                  }

                  fun fail(msg: String) {
                      note.text = "Detay alınamadı: " + msg
                      note.setTextColor(Color.parseColor("#FB8C00"))
                      addReportBtn()
                      actions.addView(
                          btn("🔍 Sayfayı tara", false) {
                              extra.removeAllViews()
                              img?.visibility = View.GONE
                              box.visibility = View.VISIBLE
                              box.wobble(true)
                              pageFlow(url, box, title, sub, extra, msg)
                          }
                      )
                  }
              }

              private fun addYt(url: String, yi: YInfo?, key: String, nameHint: String) {
                  val m = Item(UUID.randomUUID().toString(), url)
                  m.engine = "ytdlp"
                  m.sel = Ytdlp.selector(key, yi?.portrait ?: false)
                  m.qual = labelOf(key)
                  m.name = yi?.title ?: nameHint
                  m.type = if (key == "audio") "muzik" else "video"
                  val est = if (yi != null) Ytdlp.estimate(yi, key) else 0L
                  m.total = if (est > 0L) est else -1L
                  m.probed = true
                  Store.items.add(0, m)
                  Store.save(this)
                  sync()
                  svc("add", m.id)
              }

              private fun fillPreview(url: String, i: Info, box: BoxView, title: TextView, sub: TextView, extra: LinearLayout) {
                  box.wobble(false)
                  box.show(1f, true, Store.typeColor(i.type))
                  title.text = emoji(i.type) + " " + i.name
                  title.maxLines = 3
                  sub.text = typeLabel(i.type) + " · " + (if (i.total > 0) Store.fmt(i.total) else "boyut bilinmiyor")
                  sub.textSize = 14f
                  sub.setTextColor(Color.LTGRAY)
                  val free = try {
                      StatFs((getExternalFilesDir(null) ?: filesDir).path).availableBytes
                  } catch (e: Exception) {
                      Long.MAX_VALUE
                  }
                  var warn = ""
                  var warnCol = Color.GRAY
                  var okText = "İndir"
                  if (i.total > 0) {
                      if (i.total > free) {
                          warn = "⚠ Yetersiz alan: gereken " + Store.fmt(i.total) + ", boş " + Store.fmt(free)
                          warnCol = C.red
                          okText = "Yine de indir"
                      } else if (i.total * 2 > free) {
                          warn = "Alan dar: indirirken geçici kopya için yaklaşık 2 kat yer gerekir"
                          warnCol = Color.parseColor("#FB8C00")
                      } else {
                          warn = "Boş alan: " + Store.fmt(free)
                      }
                  }
                  val mode = tv(
                      if (i.ranges && i.total > 0) "⚡ Parçalı hızlı indirme" else "Tek akış · duraklatınca baştan başlar",
                      12f, Color.GRAY
                  )
                  mode.setPadding(0, dp(10), 0, 0)
                  extra.addView(mode)
                  if (warn.isNotEmpty()) {
                      val w = tv(warn, 12f, warnCol)
                      w.gravity = Gravity.CENTER
                      w.setPadding(0, dp(4), 0, 0)
                      extra.addView(w)
                  }
                  val dest = tv("Kayıt yeri: " + when (i.type) {
                      "video" -> "Galeri › Movies/Kutu"
                      "foto" -> "Galeri › Pictures/Kutu"
                      "muzik" -> "Müzik › Music/Kutu"
                      else -> "İndirilenler › Kutu"
                  }, 12f, Color.GRAY)
                  dest.setPadding(0, dp(4), 0, 0)
                  extra.addView(dest)
                  extra.addView(
                      btnRow(
                          btn("Vazgeç", false) { closeOverlay() },
                          btn(okText, true) { closeOverlay { addItem(url, i, false) } }
                      )
                  )
                  extra.alpha = 0f
                  extra.animate().alpha(1f).setDuration(300).start()
              }

              private fun shortLink(f: String): String {
                  val u = Uri.parse(f)
                  return Store.nameFromUrl(f) + "\n" + (u.host ?: "")
              }

              private fun pageFlow(url: String, box: BoxView, title: TextView, sub: TextView, extra: LinearLayout, err: String? = null) {
                  title.text = "🌐 Bu bir web sayfası"
                  sub.text = "Sayfadaki videolar aranıyor…"
                  Thread {
                      val found = try {
                          Net.scan(url)
                      } catch (e: Exception) {
                          emptyList<String>()
                      }
                      runOnUiThread {
                          box.wobble(false)
                          if (found.isEmpty()) {
                              sub.text = if (err != null) "Bulunamadı: " + err else "İçinde doğrudan indirilebilir medya bulunamadı."
                              extra.addView(btnRow(btn("📋 Rapor", false) { copyReport(url) }, btn("Kapat", false) { closeOverlay() }))
                          } else {
                              title.text = "🎞 " + found.size + " medya bulundu"
                              sub.text = "İndirmek istediğini seç"
                              val sc = ScrollView(this)
                              val col = LinearLayout(this)
                              col.orientation = LinearLayout.VERTICAL
                              for (f in found.take(8)) {
                                  val r = tv(shortLink(f), 13f, Color.WHITE)
                                  r.background = pill(C.card, 14)
                                  r.setPadding(dp(14), dp(10), dp(14), dp(10))
                                  r.maxLines = 3
                                  r.ellipsize = TextUtils.TruncateAt.END
                                  r.pressable()
                                  r.setOnClickListener { showPreview(f) }
                                  val lp = LinearLayout.LayoutParams(-1, -2)
                                  lp.topMargin = dp(8)
                                  col.addView(r, lp)
                              }
                              sc.addView(col)
                              extra.addView(sc, LinearLayout.LayoutParams(-1, minOf(found.size, 4) * dp(64) + dp(8)))
                              extra.addView(btnRow(btn("Kapat", false) { closeOverlay() }))
                          }
                      }
                  }.start()
              }

              // ---------- QR gönder ----------
              private fun showSender(m: Item) {
                  val ip = FileServer.localIp()
                  if (ip == null) {
                      toast("Wi-Fi veya hotspot bağlantısı bulunamadı")
                      return
                  }
                  val token = UUID.randomUUID().toString().substring(0, 8)
                  val port = try {
                      FileServer.start(this, Uri.parse(m.uri), m.name, m.total, token)
                  } catch (e: Exception) {
                      toast("Sunucu açılamadı")
                      return
                  }
                  val text = "kutu://" + ip + ":" + port + "/" + token + "/" + Uri.encode(m.name)
                  val c = card()
                  val title = tv("Kutuyu gönder", 20f, Color.WHITE, true)
                  val sub = tv(emoji(m.type) + " " + m.name + " · " + Store.fmt(m.total), 13f, Color.LTGRAY)
                  sub.gravity = Gravity.CENTER
                  sub.maxLines = 2
                  sub.setPadding(0, dp(4), 0, dp(12))
                  val qrBox = FrameLayout(this)
                  qrBox.background = pill(Color.WHITE, 18)
                  qrBox.setPadding(dp(10), dp(10), dp(10), dp(10))
                  val img = ImageView(this)
                  img.setImageBitmap(Qr.make(text, 640))
                  img.scaleType = ImageView.ScaleType.FIT_XY
                  qrBox.addView(img, FrameLayout.LayoutParams(dp(230), dp(230)))
                  val line = View(this)
                  line.setBackgroundColor(C.red)
                  line.alpha = 0.85f
                  qrBox.addView(line, FrameLayout.LayoutParams(dp(230), dp(2)))
                  val scan = ObjectAnimator.ofFloat(line, "translationY", 0f, dp(228).toFloat())
                  scan.duration = 1400
                  scan.repeatMode = ValueAnimator.REVERSE
                  scan.repeatCount = ValueAnimator.INFINITE
                  scan.start()
                  val st = LinearLayout(this)
                  st.gravity = Gravity.CENTER_VERTICAL
                  st.setPadding(0, dp(12), 0, 0)
                  val sbox = BoxView(this)
                  sbox.show(0f, false, C.red)
                  val status = tv("Alıcı Kutu ile bu kodu okutsun\n(aynı Wi-Fi veya hotspot)", 13f, Color.LTGRAY)
                  st.addView(sbox, LinearLayout.LayoutParams(dp(56), dp(56)))
                  val slp = LinearLayout.LayoutParams(-2, -2)
                  slp.leftMargin = dp(12)
                  st.addView(status, slp)
                  c.addView(title)
                  c.addView(sub)
                  c.addView(qrBox, LinearLayout.LayoutParams(-2, -2))
                  c.addView(st)
                  c.addView(btnRow(btn("Kapat", false) { closeOverlay() }))
                  openOverlay(c)
                  c.scaleX = 0.85f
                  c.scaleY = 0.85f
                  c.alpha = 0f
                  c.animate().scaleX(1f).scaleY(1f).alpha(1f).setDuration(350)
                      .setInterpolator(OvershootInterpolator(1.3f)).start()
                  var lastUi = 0L
                  FileServer.onProgress = { sent ->
                      val now = System.currentTimeMillis()
                      if (now - lastUi > 250L || sent >= m.total) {
                          lastUi = now
                          runOnUiThread {
                              val p = if (m.total > 0) (sent.toFloat() / m.total).coerceIn(0f, 1f) else 0f
                              val done = sent >= m.total
                              sbox.show(p, done, C.red)
                              status.text = if (done) "Teslim edildi ✓" else "Gönderiliyor… %" + (p * 100).toInt()
                              status.setTextColor(if (done) Color.parseColor("#43A047") else Color.LTGRAY)
                          }
                      }
                  }
                  overlayClose = {
                      FileServer.stop()
                      FileServer.onProgress = null
                      scan.cancel()
                  }
              }

              // ---------- QR oku ----------
              private fun scanQr() {
                  try {
                      val opts = GmsBarcodeScannerOptions.Builder().setBarcodeFormats(Barcode.FORMAT_QR_CODE).build()
                      GmsBarcodeScanning.getClient(this, opts).startScan()
                          .addOnSuccessListener { b -> onScanned(b.rawValue ?: "") }
                          .addOnFailureListener { e ->
                              if (e.message?.contains("cancel", true) != true) toast("Tarayıcı açılamadı (Google Play hizmetleri gerekli)")
                          }
                  } catch (e: Exception) {
                      toast("Tarayıcı açılamadı (Google Play hizmetleri gerekli)")
                  }
              }

              private fun onScanned(t: String) {
                  if (!t.startsWith("kutu://")) {
                      toast("Bu bir Kutu kodu değil")
                      return
                  }
                  addItem("http://" + t.removePrefix("kutu://"), null, true)
              }

              // ---------- kutu geldi animasyonu ----------
              private fun showArrival(m: Item) {
                  arrivalBusy = true
                  val col = Store.typeColor(m.type)
                  val frame = FrameLayout(this)
