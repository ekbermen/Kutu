          package com.kutu.app

          import android.content.Context
          import android.graphics.Color
          import android.os.Handler
          import android.os.Looper
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.net.URLDecoder
          import java.util.concurrent.CopyOnWriteArrayList

          class Item(val id: String, val url: String) {
              var name = "dosya"
              var type = "diger"
              var total = -1L
              var status = "queued"
              var uri = ""
              var parts = LongArray(8)
              var ranges = false
              var probed = false
              var qr = false
              var seen = false
              @Volatile var speed = 0L
              @Volatile var conn = 0
              var engine = "direct"
              var sel = ""
              var qual = ""
              @Volatile var frac = 0f
              @Volatile var etaSec = -1L
              @Volatile var err = ""
              @Volatile var got = 0L
              fun fraction(): Float =
                  if (engine == "ytdlp") frac.coerceIn(0f, 1f)
                  else if (total > 0) (parts.sum().toFloat() / total).coerceIn(0f, 1f)
                  else 0f
              fun done(): Long = if (engine == "ytdlp") (fraction() * maxOf(total, 0L)).toLong() else parts.sum()
          }

          object Store {
              val items = CopyOnWriteArrayList<Item>()
              var onChange: (() -> Unit)? = null
              private val main = Handler(Looper.getMainLooper())
              private var loaded = false

              @Synchronized
              fun load(c: Context) {
                  if (loaded) return
                  loaded = true
                  try {
                      val a = JSONArray(c.getSharedPreferences("kutu", 0).getString("items", "[]"))
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val m = Item(o.getString("id"), o.getString("url"))
                          m.name = o.optString("name", "dosya")
                          m.type = o.optString("type", "diger")
                          m.total = o.optLong("total", -1L)
                          m.status = o.optString("status", "paused")
                          m.uri = o.optString("uri", "")
                          m.ranges = o.optBoolean("ranges", false)
                          m.probed = o.optBoolean("probed", false)
                          m.qr = o.optBoolean("qr", false)
                          m.seen = o.optBoolean("seen", false)
                          m.engine = o.optString("engine", "direct")
                          m.sel = o.optString("sel", "")
                          m.qual = o.optString("qual", "")
                          m.frac = o.optDouble("frac", 0.0).toFloat()
                          val ps = o.optString("parts", "").split(",")
                          m.parts = if (ps.size == 8) LongArray(8) { k -> ps[k].toLongOrNull() ?: 0L } else LongArray(8)
                          if (m.status == "running" || m.status == "queued") m.status = "paused"
                          items.add(m)
                      }
                  } catch (e: Exception) {
                  }
              }

              @Synchronized
              fun save(c: Context) {
                  val a = JSONArray()
                  for (m in items) {
                      a.put(
                          JSONObject().put("id", m.id).put("url", m.url).put("name", m.name)
                              .put("type", m.type).put("total", m.total).put("status", m.status)
                              .put("uri", m.uri).put("parts", m.parts.joinToString(","))
                              .put("ranges", m.ranges).put("probed", m.probed)
                              .put("qr", m.qr).put("seen", m.seen)
                              .put("engine", m.engine).put("sel", m.sel).put("qual", m.qual).put("frac", m.frac.toDouble())
                      )
                  }
                  c.getSharedPreferences("kutu", 0).edit().putString("items", a.toString()).apply()
              }

              fun changed() {
                  main.post { onChange?.invoke() }
              }

              fun tmp(c: Context, id: String): File = File(c.getExternalFilesDir(null) ?: c.filesDir, "$id.part")

              fun fmt(b: Long): String = when {
                  b >= 1073741824L -> String.format("%.2f GB", b / 1073741824.0)
                  b >= 1048576L -> String.format("%.1f MB", b / 1048576.0)
                  b >= 1024L -> String.format("%d KB", b / 1024L)
                  else -> "$b B"
              }

              fun pct(m: Item): Int = (m.fraction() * 100).toInt().coerceIn(0, 100)

              private fun etaText(s: Long): String = when {
                  s < 0L -> ""
                  s < 60L -> "~" + (s + 1) + " sn kaldı"
                  s < 3600L -> "~" + ((s + 59L) / 60L) + " dk kaldı"
                  else -> "~" + (s / 3600L) + " sa " + ((s % 3600L) / 60L) + " dk kaldı"
              }

              fun eta(m: Item): String {
                  if (m.engine == "ytdlp") return if (m.etaSec > 0L) etaText(m.etaSec) else ""
                  if (m.speed <= 0L || m.total <= 0L) return ""
                  return etaText((m.total - m.done()) / m.speed)
              }

              fun info(m: Item): String {
                  val p = pct(m)
                  return when (m.status) {
                      "running" -> {
                          val e = eta(m)
                          if (m.engine == "ytdlp") {
                              if (m.frac <= 0f && m.got <= 0L) {
                                  "Hazırlanıyor…"
                              } else {
                                  "%" + p + (if (m.qual.isEmpty()) "" else " · " + m.qual) +
                                      (if (m.total <= 0L && m.got > 0L) " · " + fmt(m.got) else "") +
                                      (if (m.speed > 0L) " · " + fmt(m.speed) + "/s" else "") +
                                      (if (e.isEmpty()) "" else " · " + e)
                              }
                          } else {
                              "%" + p + " · " + fmt(m.done()) + (if (m.total > 0) " / " + fmt(m.total) else "") +
                                  " · " + fmt(m.speed) + "/s" + (if (e.isEmpty()) "" else " · " + e) +
                                  (if (m.conn > 1) " · " + m.conn + " bağlantı" else "")
                          }
                      }
                      "queued" -> "Sıraya alındı…"
                      "paused" -> "Duraklatıldı · %" + p
                      "error" -> if (m.err.isEmpty()) "Hata · ▶ ile tekrar dene" else "Hata: " + m.err.take(90)
                      "done" -> "Tamam · " + fmt(m.total) + (if (m.qual.isEmpty()) "" else " · " + m.qual)
                      else -> ""
                  }
              }

              fun short(m: Item): String {
                  if (m.status != "running") return info(m)
                  val e = eta(m)
                  return "%" + pct(m) + " · " + (if (e.isEmpty()) fmt(m.speed) + "/s" else e)
              }

              val videoExts = setOf("mp4", "mkv", "webm", "avi", "mov", "3gp", "flv", "wmv", "m4v", "ts", "mpeg")
              val photoExts = setOf("png", "jpg", "jpeg", "webp", "gif", "bmp", "heic", "avif")
              val musicExts = setOf("mp3", "m4a", "flac", "wav", "ogg", "aac", "opus", "wma")
              val mediaExts: Set<String> = videoExts + photoExts + musicExts
              val webExts = setOf("html", "htm", "php", "asp", "aspx", "jsp", "cgi", "")

              fun typeOf(name: String, ct: String?): String {
                  val e = name.substringAfterLast('.', "").lowercase()
                  val c = ct?.substringBefore(';')?.trim()?.lowercase() ?: ""
                  return when {
                      c.startsWith("video/") -> "video"
                      c.startsWith("image/") -> "foto"
                      c.startsWith("audio/") -> "muzik"
                      e in videoExts -> "video"
                      e in photoExts -> "foto"
                      e in musicExts -> "muzik"
                      else -> "diger"
                  }
              }

              fun typeColor(t: String): Int = when (t) {
                  "video" -> Color.parseColor("#E53935")
                  "foto" -> Color.parseColor("#1E88E5")
                  "muzik" -> Color.parseColor("#8E24AA")
                  else -> Color.parseColor("#FB8C00")
              }

              fun clean(n: String): String = n.replace(Regex("[\\\\/:*?\"<>|]"), "_").ifBlank { "dosya" }

              fun nameFromUrl(u: String): String {
                  val path = u.substringBefore('?').substringBefore('#').trimEnd('/')
                  var n = path.substringAfterLast('/')
                  try {
                      n = URLDecoder.decode(n, "UTF-8")
                  } catch (e: Exception) {
                  }
                  return clean(n)
              }
          }
