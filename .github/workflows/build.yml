          package com.kutu.app

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.net.Uri
          import android.os.ParcelFileDescriptor
          import com.google.zxing.BarcodeFormat
          import com.google.zxing.EncodeHintType
          import com.google.zxing.qrcode.QRCodeWriter
          import java.io.FileInputStream
          import java.net.Inet4Address
          import java.net.NetworkInterface
          import java.net.ServerSocket
          import java.net.Socket
          import java.util.concurrent.atomic.AtomicLong

          object Qr {
              fun make(text: String, size: Int): Bitmap {
                  val hints = HashMap<EncodeHintType, Any>()
                  hints[EncodeHintType.MARGIN] = 1
                  val m = QRCodeWriter().encode(text, BarcodeFormat.QR_CODE, size, size, hints)
                  val px = IntArray(size * size)
                  for (y in 0 until size) {
                      for (x in 0 until size) {
                          px[y * size + x] = if (m.get(x, y)) Color.BLACK else Color.WHITE
                      }
                  }
                  val b = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                  b.setPixels(px, 0, size, 0, 0, size, size)
                  return b
              }
          }

          object FileServer {
              private var ss: ServerSocket? = null
              private val sentA = AtomicLong(0)
              @Volatile var onProgress: ((Long) -> Unit)? = null

              fun localIp(): String? {
                  val all = try {
                      NetworkInterface.getNetworkInterfaces().toList()
                  } catch (e: Exception) {
                      return null
                  }
                  val pref = Regex("wlan|swlan|ap|eth|p2p")
                  for (pass in 0..1) {
                      for (n in all) {
                          if (!n.isUp || n.isLoopback) continue
                          if (pass == 0 && !pref.containsMatchIn(n.name)) continue
                          for (a in n.inetAddresses.toList()) {
                              if (a is Inet4Address && a.isSiteLocalAddress) return a.hostAddress
                          }
                      }
                  }
                  return null
              }

              fun start(ctx: Context, uri: Uri, name: String, size: Long, token: String): Int {
                  stop()
                  sentA.set(0)
                  val app = ctx.applicationContext
                  val s = ServerSocket(0)
                  ss = s
                  Thread {
                      while (!s.isClosed) {
                          try {
                              val c = s.accept()
                              Thread { serve(app, c, uri, name, size, token) }.start()
                          } catch (e: Exception) {
                              break
                          }
                      }
                  }.start()
                  return s.localPort
              }

              fun stop() {
                  try {
                      ss?.close()
                  } catch (e: Exception) {
                  }
                  ss = null
              }

              private fun serve(ctx: Context, c: Socket, uri: Uri, name: String, size: Long, token: String) {
                  var pfd: ParcelFileDescriptor? = null
                  try {
                      c.soTimeout = 30000
                      val rd = c.getInputStream().bufferedReader(Charsets.ISO_8859_1)
                      val req = rd.readLine() ?: return
                      var range: String? = null
                      while (true) {
                          val l = rd.readLine() ?: break
                          if (l.isEmpty()) break
                          if (l.startsWith("Range:", true)) range = l.substring(6).trim()
                      }
                      val out = c.getOutputStream()
                      val path = req.split(" ").getOrNull(1) ?: ""
                      if (!path.startsWith("/" + token + "/")) {
                          out.write("HTTP/1.1 403 Forbidden\r\nContent-Length: 0\r\nConnection: close\r\n\r\n".toByteArray())
                          out.flush()
                          return
                      }
                      var start = 0L
                      var end = size - 1
                      var partial = false
                      val rg = range
                      if (rg != null && rg.startsWith("bytes=")) {
                          val r = rg.substring(6).split("-")
                          val a = r[0].toLongOrNull()
                          val b = r.getOrNull(1)?.toLongOrNull()
                          if (a != null) {
                              start = a
                              if (b != null) end = minOf(b, size - 1)
                              partial = true
                          }
                      }
                      if (start < 0L || start > end) {
                          out.write("HTTP/1.1 416 Range Not Satisfiable\r\nContent-Length: 0\r\nConnection: close\r\n\r\n".toByteArray())
                          out.flush()
                          return
                      }
                      val len = end - start + 1
                      val h = StringBuilder()
                      h.append(if (partial) "HTTP/1.1 206 Partial Content\r\n" else "HTTP/1.1 200 OK\r\n")
                      h.append("Accept-Ranges: bytes\r\n")
                      h.append("Content-Type: application/octet-stream\r\n")
                      h.append("Content-Length: " + len + "\r\n")
                      if (partial) h.append("Content-Range: bytes " + start + "-" + end + "/" + size + "\r\n")
                      h.append("Content-Disposition: attachment; filename=\"" + Uri.encode(name) + "\"\r\n")
                      h.append("Connection: close\r\n\r\n")
                      out.write(h.toString().toByteArray())
                      pfd = ctx.contentResolver.openFileDescriptor(uri, "r")
                      val fin = FileInputStream(pfd!!.fileDescriptor)
                      fin.channel.position(start)
                      val buf = ByteArray(65536)
                      var left = len
                      while (left > 0L) {
                          val n = fin.read(buf, 0, minOf(buf.size.toLong(), left).toInt())
                          if (n < 0) break
                          out.write(buf, 0, n)
                          left -= n.toLong()
                          val s = sentA.addAndGet(n.toLong())
                          onProgress?.invoke(s)
                      }
                      out.flush()
                  } catch (e: Exception) {
                  } finally {
                      try {
                          pfd?.close()
                      } catch (e: Exception) {
                      }
                      try {
                          c.close()
                      } catch (e: Exception) {
                      }
                  }
              }
          }
